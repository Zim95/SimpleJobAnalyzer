[project]
name = "simplejobanalyzer"
version = "0.1.0"
description = "Simple Job Analyzer"
readme = "README.md"
authors = [
    { name = "Zim95", email = "shresthanamah@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ijson>=3.6.0",
]

[project.scripts]
simplejobanalyzer = "simplejobanalyzer:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
